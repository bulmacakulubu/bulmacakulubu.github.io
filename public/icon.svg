             L 352 236 
             C 376 236 392 244 392 256 
             C 392 268 376 276 352 276 
             L 352 336 
             C 352 344 344 352 336 352 
             L 276 352 
             C 276 328 268 312 256 312 
             C 244 312 236 328 236 352 
             L 176 352 
             C 168 352 160 344 160 336 
             L 160 276 
             C 184 276 200 268 200 256 
             C 200 244 184 236 160 236 
             L 160 176 
             C 160 168 168 160 176 160 Z" 
