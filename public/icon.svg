  </g>

  <!-- BK Brand Text -->
  <text x="256" y="278" font-family="system-ui, -apple-system, sans-serif" font-size="76" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="2">BK</text>
  <text x="256" y="420" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="700" fill="#a5b4fc" text-anchor="middle" letter-spacing="6">BULMACA</text>
